name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Backend
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Full Stack (Server & Client)
        run: npm run build
