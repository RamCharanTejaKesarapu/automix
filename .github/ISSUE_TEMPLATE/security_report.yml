name: "🔒 Security Vulnerability Report"
description: Report a security or privacy vulnerability in AutoMix
title: "[SECURITY]: "
labels: ["security", "high-priority"]
body:
  - type: markdown
    attributes:
      value: |
        **Note**: If you discover a critical security vulnerability involving credential leaks or remote code execution, please also review our [Security Policy](../../SECURITY.md).
  - type: textarea
    id: vulnerability
    attributes:
      label: Vulnerability Description
      description: Provide a clear description of the vulnerability.
      placeholder: Describe the security flaw, impact, and affected components.
    validations:
      required: true
  - type: textarea
    id: poc
    attributes:
      label: Proof of Concept / Reproduction
      description: Steps or payload required to reproduce the security flaw safely.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Estimated Severity
      options:
        - "Low"
        - "Medium"
        - "High"
        - "Critical"
    validations:
      required: true
